name: Manuscript build and mathematical checks

on:
  push:
    branches: [main]
    paths:
      - paper.tex
      - run_all.py
      - verification/verify_n4_14_states.py
      - .github/workflows/build-manuscript.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manuscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended latexmk

      - name: Run mathematical certificates
        run: python3 run_all.py --full

      - name: Compile paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex

      - name: Refresh source hashes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          root = Path('.')
          ignored = ('.aux','.log','.out','.toc','.fls','.fdb_latexmk','.synctex.gz','.bbl','.blg')
          paths = sorted(p for p in root.rglob('*')
                         if p.is_file() and '.git' not in p.parts
                         and '__pycache__' not in p.parts
                         and p.name != 'SHA256SUMS'
                         and not p.name.endswith(ignored))
          rows = [f"{sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}" for p in paths]
          Path('SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          python3 verify_manifest.py

      - name: Publish corrected PDF and checksum manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper.pdf SHA256SUMS
          if ! git diff --cached --quiet; then
            git commit -m "Build corrected manuscript PDF and verify checksums"
            git push origin HEAD:main
          fi
